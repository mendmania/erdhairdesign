name: Test, publish and deploy salon
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test the application inside its production Node base
        run: docker build --target test --tag erdhairdesign:test .
      - name: Build the runtime image
        run: docker build --target runtime --tag erdhairdesign:checked .
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Select this repository's registry package
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=min
          sbom: true
      - name: Record immutable deployment image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo 'Use this immutable image with scripts/deploy.mjs:' >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: https://tregubio.com
    concurrency:
      group: salon-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: Skip superseded commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [ "$(gh api repos/mendmania/erdhairdesign/git/ref/heads/main --jq '.object.sha')" = "$RELEASE_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit exists; this release was skipped.' >> "$GITHUB_STEP_SUMMARY"
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Load the salon deployment credential
        if: steps.current.outputs.deploy == 'true'
        env:
          SALON_KUBECONFIG: ${{ secrets.SALON_KUBECONFIG }}
        run: |
          if [ -z "$SALON_KUBECONFIG" ]; then
            echo '::error::Production setup is incomplete. Run scripts/setup-ci.mjs from a machine that can reach the salon Kubernetes API.'
            exit 1
          fi
          umask 077
          printf '%s' "$SALON_KUBECONFIG" > "$RUNNER_TEMP/salon-kubeconfig.json"
      - name: Install a verified Kubernetes client
        if: steps.current.outputs.deploy == 'true'
        env:
          KUBECTL_VERSION: v1.35.7
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 -o kubectl "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          curl --fail --silent --show-error --location --retry 3 -o kubectl.sha256 "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256"
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/salon-tools"
          install -m 0755 kubectl "$RUNNER_TEMP/salon-tools/kubectl"
          echo "$RUNNER_TEMP/salon-tools" >> "$GITHUB_PATH"
      - name: Check production API connectivity
        if: steps.current.outputs.deploy == 'true'
        run: kubectl --kubeconfig "$RUNNER_TEMP/salon-kubeconfig.json" --request-timeout=10s get --raw=/readyz
      - name: Back up, deploy and verify production
        if: steps.current.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IMAGE: ${{ needs.publish.outputs.image }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node scripts/release.mjs --kubeconfig "$RUNNER_TEMP/salon-kubeconfig.json" \
            --image "$RELEASE_IMAGE" --revision "$RELEASE_SHA" \
            --run-id "$RELEASE_RUN" --attempt "$RELEASE_ATTEMPT" > "$RUNNER_TEMP/salon-release.json"
          echo 'Production verified at https://tregubio.com' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/salon-release.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the temporary credential
        if: always()
        run: rm -f "$RUNNER_TEMP/salon-kubeconfig.json"
